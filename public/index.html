<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbit | Smart Scheduler</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; color: #333; max-width: 600px; margin: 50px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; font-size: 1.5rem; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 0.9rem; color: #667; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        #results { margin-top: 25px; display: none; }
        .slot { background: #1a1a1a; color: #0f0; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-family: monospace; }
        .meta { color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>Orbit Scheduler</h1>
    
    <label>What kind of meeting is this?</label>
    <select id="scenario">
        <option value="peer_sync">Internal Peer Sync (Fairness + Trust)</option>
        <option value="client_meeting">External Client Meeting (Professional Boundaries)</option>
        <option value="all_hands">Town Hall / All-Hands (Majority Rules)</option>
        <option value="urgent_briefing">Urgent Briefing (Host Availability First)</option>
        <option value="culture_chat">People First (Protect Individuals)</option>
        <option value="gold_standard">Executive Interview (High Performance)</option>
    </select>

    <div style="display: flex; gap: 10px;">
        <div style="flex:1">
            <label>Date</label>
            <input type="date" id="date">
        </div>
        <div style="flex:1">
            <label>Your City (Host)</label>
            <input type="text" id="host" value="New York">
        </div>
    </div>

    <label>Team Member Cities</label>
    <textarea id="team" rows="3">London, Tokyo, Bengaluru</textarea>

    <button onclick="calculate()">Find Best Times</button>

    <div id="results"></div>
</div>

<script>
    document.getElementById('date').valueAsDate = new Date();

    async function calculate() {
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "Calculating...";
        resDiv.style.display = "block";

        const hostID = (await (await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: document.getElementById('host').value }) })).json()).timezone_id;
        
        const cities = document.getElementById('team').value.split(',').map(c => c.trim());
        const tzs = [hostID];
        for (let c of cities) {
            const d = await (await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: c }) })).json();
            tzs.push(d.timezone_id);
        }

        const data = await (await fetch('/api/optimize', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                date: document.getElementById('date').value,
                timezones: [...new Set(tzs)],
                optimize_for: hostID,
                scenario: document.getElementById('scenario').value
            })
        })).json();

        let html = "<b>Top 3 Recommendations:</b><br><br>";
        data.top_3.forEach((s, i) => {
            html += `<div class="slot">#${i+1} ${s.display_time}<br><span class="meta">Fairness: ${Math.round(s.fairness_score)} | Penalty: -${s.conflict_penalty}</span><br>`;
            s.blockers.forEach(b => html += `<small style="color:red">⚠️ ${b}</small><br>`);
            html += `</div>`;
        });
        resDiv.innerHTML = html;
    }
</script>

</body>
</html>
