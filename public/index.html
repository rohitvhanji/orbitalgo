<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbit Scheduler</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; max-width: 500px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .slot { background: #0f172a; color: white; padding: 15px; border-radius: 8px; margin-top: 10px; font-family: monospace; }
        .meta { color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Orbit Optimizer</h2>
        <label>Meeting Type</label>
        <select id="scenario">
            <option value="peer_sync">Internal Sync (Fairness)</option>
            <option value="client_meeting">Client Meeting (Strict Host)</option>
        </select>
        <input type="date" id="date">
        <input type="text" id="hostCity" placeholder="Your City" value="New York">
        <textarea id="teamCities" rows="2" placeholder="Team Cities (London, Tokyo...)">London, Tokyo</textarea>
        <button onclick="run()">Find Times</button>
        <div id="results"></div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();
        const API = "http://localhost:3000/api";

        async function run() {
            const out = document.getElementById('results');
            out.innerHTML = "Resolving cities (this takes a few seconds to avoid API limits)...";
            
            try {
                // 1. Get all timezones in one go
                const cities = [document.getElementById('hostCity').value, ...document.getElementById('teamCities').value.split(',').map(c => c.trim())];
                const res = await fetch(`${API}/resolve-team`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ cities }) 
                });
                const { timezones } = await res.json();

                // 2. Optimize
                const opt = await fetch(`${API}/optimize`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        date: document.getElementById('date').value,
                        timezones: timezones,
                        optimize_for: timezones[0],
                        scenario: document.getElementById('scenario').value
                    })
                });
                const data = await opt.json();

                // 3. Render
                let html = "";
                data.top_3.forEach(s => {
                    html += `<div class="slot"><b>${s.display_time}</b><br><span class="meta">Fairness: ${Math.round(s.fairness_score)} | Tax: -${s.conflict_penalty}</span><br>`;
                    s.breakdown.forEach(l => html += `<small>${l.zone.split('/').pop()}: ${l.local_time}</small><br>`);
                    html += `</div>`;
                });
                out.innerHTML = html || "No slots found.";
            } catch (e) { out.innerHTML = "Error connecting to server. Is 'node index.js' running?"; }
        }
    </script>
</body>
</html>
