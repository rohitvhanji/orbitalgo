<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbit Intelligence Engine</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f4f4f5; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #results { margin-top: 20px; background: #18181b; color: #10b981; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Orbit Optimizer</h1>
    
    <label>What kind of meeting is this?</label>
    <select id="scenario">
        <option value="peer_sync">Internal Peer Sync (Fairness + Trust)</option>
        <option value="client_meeting">External Client Meeting (Strict Host)</option>
        <option value="all_hands">Town Hall / All-Hands (Majority Rules)</option>
        <option value="urgent_briefing">Urgent Briefing (Host Availability First)</option>
        <option value="culture_chat">People First (Protect Individuals)</option>
        <option value="gold_standard">Executive Interview (High Performance)</option>
    </select>

    <div style="display: flex; gap: 10px;">
        <div style="flex:1">
            <label>Date</label>
            <input type="date" id="dateInput" value="2024-05-20">
        </div>
        <div style="flex:1">
            <label>Host City</label>
            <input type="text" id="hostInput" value="New York">
        </div>
    </div>

    <label>Team Cities</label>
    <textarea id="cityInput">London, Tokyo, Bengaluru</textarea>

    <button onclick="run()">Find Best Times</button>
    <div id="results"></div>
</div>

<script>
    async function run() {
        const out = document.getElementById('results');
        out.innerHTML = "Processing...";
        out.style.display = "block";

        try {
            // Resolve Host
            const hRes = await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: document.getElementById('hostInput').value }) });
            const hData = await hRes.json();

            // Resolve Team
            const cities = document.getElementById('cityInput').value.split(',').map(c => c.trim());
            const teamIDs = [];
            for (let c of cities) {
                const r = await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: c }) });
                const d = await r.json();
                teamIDs.push(d.timezone_id);
            }

            // Optimize
            const oRes = await fetch('/api/optimize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    date: document.getElementById('dateInput').value,
                    timezones: teamIDs,
                    host_timezone: hData.timezone_id,
                    scenario: document.getElementById('scenario').value
                })
            });
            const data = await oRes.json();

            let html = "⚡ TOP 3 RECOMMENDATIONS:\n\n";
            data.top_3.forEach((s, i) => {
                html += `#${i+1} [ ${s.display_time} ] Score: ${Math.round(s.score)}\n`;
                html += `   (Penalty Tax: -${s.penalty})\n`;
                s.blockers.forEach(b => html += `   ⚠️ ${b}\n`);
                html += `\n`;
            });
            out.innerText = html;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>

</body>
</html>
