<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Universal Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f5; color: #18181b; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #e4e4e7; border-radius: 6px; font-family: monospace; font-size: 0.9rem; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 80px; }
        button { background: #000; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #a1a1aa; cursor: not-allowed; }
        
        #status-log { margin-bottom: 15px; font-size: 0.85rem; color: #64748b; font-family: monospace; }
        .log-ok { color: #10b981; }
        .log-err { color: #ef4444; }

        #results { white-space: pre-wrap; background: #18181b; color: #00ff9d; padding: 20px; border-radius: 8px; font-family: monospace; overflow-x: auto; display: none; }
        .tag { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 15px; }

        /* NEW STYLES FOR HOST BOX */
        .host-box { background: #f0f9ff; border: 1px solid #bae6fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; }
        .host-col { flex: 1; }
        .host-label { color: #0369a1; }
        .host-desc { font-size: 0.75rem; color: #0c4a6e; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <span class="tag">UNIVERSAL EXPRESS API</span>
        <h1>Orbit Intelligence Engine</h1>
        <p style="color:#71717a; font-size:0.9rem; margin-bottom:20px;">
            Calculates 1-hour slots. Enforces strict 9-5 for the Host.
        </p>
        
        <label>Target Date</label>
        <input type="date" id="dateInput" value="2023-11-01">

        <div class="host-box">
            <div class="host-col">
                <label class="host-label">🎤 Meeting Host (Gatekeeper)</label>
                <input type="text" id="hostInput" value="New York" placeholder="e.g. London">
                <small class="host-desc">Must be awake (9am - 5:30pm). Slot is Red if unavailable.</small>
            </div>
            <div class="host-col">
                <label class="host-label">👀 Viewer (You)</label>
                <input type="text" id="viewerInput" value="Bengaluru" placeholder="e.g. Tokyo">
                <small class="host-desc">Results are shown in this timezone.</small>
            </div>
        </div>

        <label>Team Locations (Comma Separated)</label>
        <textarea id="cityInput">London, Tokyo</textarea>
        
        <div id="status-log"></div>

        <button onclick="runSimulation()" id="btn">Find Best Times</button>
        <div style="margin-top:10px; text-align:right;">
             <small><a href="#" onclick="checkHealth()">Check Server Status</a></small>
        </div>
    </div>

    <div id="results"></div>

    <script>
        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                alert(`STATUS: ${data.status}\nENV: ${data.env}`);
            } catch(e) { alert("Server Offline"); }
        }

        async function runSimulation() {
            const btn = document.getElementById('btn');
            const log = document.getElementById('status-log');
            const resBox = document.getElementById('results');
            
            btn.disabled = true;
            btn.innerText = "Resolving Locations...";
            resBox.style.display = 'none';
            log.innerHTML = '';

            try {
                // 1. Get Inputs from the NEW fields
                const cities = document.getElementById('cityInput').value.split(',').map(s => s.trim()).filter(s => s);
                const hostCity = document.getElementById('hostInput').value.trim();   // <--- NEW
                const viewerCity = document.getElementById('viewerInput').value.trim(); // <--- NEW

                // Helper: Resolve a single city
                const resolveCity = async (name, label) => {
                    try {
                        const res = await fetch('/api/resolve', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ city: name })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            log.innerHTML += `<div class="log-ok">✓ ${label}: ${data.resolved_name} (${data.timezone_id})</div>`;
                            return data.timezone_id;
                        } else {
                            throw new Error(data.error);
                        }
                    } catch (e) {
                        log.innerHTML += `<div class="log-err">✕ Failed ${label}: ${name}</div>`;
                        throw e;
                    }
                };

                // 2. Resolve Host & Viewer first
                const hostID = await resolveCity(hostCity, "Host");
                const viewerID = await resolveCity(viewerCity, "Viewer");

                // 3. Resolve Team
                const teamIDs = [];
                for (const city of cities) {
                    try {
                        const id = await resolveCity(city, "Team");
                        teamIDs.push(id);
                    } catch(e) {}
                }

                // IMPORTANT: Add Host to the Team list so their convenience score is counted!
                if (!teamIDs.includes(hostID)) {
                    teamIDs.push(hostID);
                }

                if (teamIDs.length === 0) throw new Error("No valid locations found.");

                // 4. Call Optimize API with explicit Host & Viewer
                btn.innerText = "Calculating Schedule...";
                
                const optRes = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: document.getElementById('dateInput').value,
                        timezones: teamIDs,
                        host_timezone: hostID,      // <--- Logic uses this for 9-5 check
                        optimize_for: viewerID      // <--- Logic uses this for display formatting
                    })
                });

                const optData = await optRes.json();
                if (!optRes.ok) throw new Error(optData.error || "Optimization Failed");

                // 5. Render Results
                let output = `⚡ BEST MATCHES (Viewer Time: ${optData.viewer}):\n`;
                output += `   Host Time: ${optData.host}\n\n`;
                
                if (optData.top_3.length === 0) {
                    output += "⚠️ No viable times found where Host is available.\n";
                }

                optData.top_3.forEach((slot, i) => {
                    output += `#${i+1} [ ${slot.display_time} ] Score: ${slot.score}\n`;
                    if(slot.blockers && slot.blockers.length) {
                        slot.blockers.forEach(b => output += `   ⚠️ ${b}\n`);
                    } else {
                        output += `   ✨ Perfect Match\n`;
                    }
                    output += `\n`;
                });

                // Debug Data
                output += `--------------------------------\n`;
                output += `RAW DATA:\n` + JSON.stringify(optData, null, 2);

                resBox.innerText = output;
                resBox.style.display = 'block';

            } catch (err) {
                resBox.innerText = "❌ ERROR:\n" + err.message;
                resBox.style.display = 'block';
                resBox.style.color = '#f87171';
            } finally {
                btn.innerText = "Find Best Times";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
