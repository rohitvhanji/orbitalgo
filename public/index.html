<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Universal Engine</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f5; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.8rem; text-transform: uppercase; color: #64748b; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #e4e4e7; border-radius: 6px; margin-bottom: 15px; font-size: 1rem; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { background: #000; color: #fff; width: 100%; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #results { background: #18181b; color: #10b981; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; display: none; }
        .badge { display: inline-block; padding: 4px 8px; background: #eff6ff; color: #2563eb; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">ORBIT ENGINE v2.0</div>
        <h1>Meeting Intelligence</h1>

        <div class="row">
            <div class="col">
                <label>Date</label>
                <input type="date" id="dateInput" value="2024-05-20">
            </div>
            <div class="col">
                <label>Meeting Culture (Weight Profile)</label>
                <select id="profileInput">
                    <option value="balanced">⚖ Balanced (Fairness First)</option>
                    <option value="efficiency">⚡ Efficiency (Majority Rules)</option>
                    <option value="human">🧘 Human-First (No One Suffers)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Host City</label>
                <input type="text" id="hostInput" value="New York">
            </div>
            <div class="col">
                <label>Host Mode</label>
                <select id="hostModeInput">
                    <option value="strict">Strict (9-5)</option>
                    <option value="flexible">Peer (Flexible)</option>
                </select>
            </div>
        </div>

        <label>Team Cities (Comma Separated)</label>
        <textarea id="cityInput">London, Tokyo, Bengaluru</textarea>

        <button onclick="run()">Find Optimal Times</button>
    </div>

    <div id="results"></div>

    <script>
        async function run() {
            const resDiv = document.getElementById('results');
            resDiv.style.display = 'block';
            resDiv.innerText = "Processing...";

            try {
                // 1. Resolve Host
                const hRes = await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: document.getElementById('hostInput').value }) });
                const hData = await hRes.json();
                
                // 2. Resolve Team
                const cities = document.getElementById('cityInput').value.split(',').map(s => s.trim());
                const teamIDs = [hData.timezone_id];
                for (let c of cities) {
                    const r = await fetch('/api/resolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ city: c }) });
                    const d = await r.json();
                    teamIDs.push(d.timezone_id);
                }

                // 3. Optimize
                const oRes = await fetch('/api/optimize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        date: document.getElementById('dateInput').value,
                        timezones: [...new Set(teamIDs)],
                        optimize_for: hData.timezone_id,
                        host_mode: document.getElementById('hostModeInput').value,
                        profile: document.getElementById('profileInput').value
                    })
                });
                const oData = await oRes.json();

                let out = `MODE: ${oData.profile.toUpperCase()} (Weight: ${oData.weight_used})\n\n`;
                oData.top_3.forEach((s, i) => {
                    out += `#${i+1} [ ${s.display_time} ] Fairness Score: ${s.fairness_score}\n`;
                    out += `   Happiness: ${s.happiness_score} | Penalty: -${s.conflict_penalty}\n`;
                    s.blockers.forEach(b => out += `   ⚠️ ${b}\n`);
                    out += `\n`;
                });
                resDiv.innerText = out;
            } catch (e) {
                resDiv.innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
